<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="../css/styles2.css" rel="stylesheet">
    <link href="../lib/css/bootstrap.min.css" rel="stylesheet">
    <script src="../lib/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="d-flex">
            <a class="navbar-brand me-2 mb-1 d-flex align-items-center" href="./indexProfesor.html">
              <img src="../img/checkbuap_logo.jpeg" height="30" alt="Check BUAP logo" loading="lazy" style="margin-top: 2px"/>
            </a>
            <ul class="navbar-nav flex-row d-none d-md-flex">
                <li class="nav-item me-3 me-lg-1 active">
                  <a class="nav-link" href="#">
                    Clase
                  </a>
                </li>
                <li class="nav-item me-3 me-lg-1 active">
                    <a class="nav-link" href="#">
                      Reporte
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <a class="btn btn-danger me-3" href="../index.html">Salir</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="card card-login">
            <img alt="Check BUAP logo" id="check-buap-img" align="center" src="../img/checkbuap_logo.jpeg"/>
            <img alt="perfil lobo" id="perfil-img" class="profile-img-card" src="../img/wolf_tail.gif"/>
            <form class="form-login mt-4 mb-2">
                <input type="email" id="inputEmail" class="form-control" placeholder="Usuario" required autofocus>
                <br>
                <input type="password" id="inputPassword" class="form-control" placeholder="Contraseña" required>
                <br>
                <button class="btn btn-lg btn-primary btn-block btn-login" type="submit">Ingresar</button>
            </form>
            <p align="center">
                ¿Nuevo usuario?
                <a href="./signin.html" class="forgot-password">Registrate aquí</a>
            </p>
        </div>
    </div>
</body>
</html>
