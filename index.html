<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="./css/styles.css" rel="stylesheet">
    <link href="./lib/css/bootstrap.min.css" rel="stylesheet">
    <link href="./img/checkbuap_icon.png" rel="icon">
    <link rel="manifest" href="./js/manifest.json">
</head>
<body>
    <div class="container">
        <div class="card card-login">
            <button id="check-buap-img">
            <img alt="Check BUAP logo"  align="center" src="./img/checkbuap_logo.jpeg"/>
        </button>
            <img alt="perfil lobo" id="perfil-img" class="profile-img-card" src="./img/wolf_tail.gif"/>
            <!-- Error Toast -->
            <div class="toast bg-danger text-white w-100">
                <div class="d-flex">
                    <div id="alertMessage" class="toast-body"></div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
            <form class="form-login mt-4 mb-2" id="login-form">
                <input type="email" id="inputEmail" class="form-control" placeholder="Usuario" required autofocus>
                <br>
                <input type="password" id="inputPassword" class="form-control" placeholder="Contraseña" required>
                <br>
                <button class="btn btn-lg btn-primary btn-block btn-login" type="submit">Ingresar</button>
            </form>  
            <p align="center">
                ¿Nuevo usuario?
                <a href="./html/signup.html" class="forgot-password">Registrate aquí</a>
            </p>
        </div>
    </div>
    <script src="./js/index.js" type="module"></script>
    <script src="./lib/js/bootstrap.min.js"></script>
</body>
</html>
